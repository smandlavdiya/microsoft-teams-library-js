<html>
  <head>
    <script
      type="text/javascript"
      src="JevelinBridge.min.js"
    ></script>
    <h2 style="font-size: 40px">Starting mock external oauth2</h2>
    <script>
      function appendLog(msg) {
        const element = document.createElement('p');
        element.textContent = msg;
        document.getElementById('log').appendChild(element);
      }

      const params = new URLSearchParams(window.location.search);
      const titleId = params.get('titleId');

      async function callteamsJS() {
        if (JevelinBridge) {
          appendLog('successfully loaded JevelinBridge');
          try {
            await JevelinBridge.app.initialize();
            if (titleId === 'testOauthFailureTitleId') {
              JevelinBridge.authentication.notifyFailure('Failed');
              appendLog('notifyFailure sent');
            } else {
              JevelinBridge.authentication.notifySuccess('Success');
              appendLog('notifySuccess sent');
            }
          } catch (e) {
            appendLog('Error calling JevelinBridge: ' + e);
          }
        } else {
          appendLog('no JevelinBridge');
        }
      }
    </script>
  </head>
  <div id="log"></div>
  <body onload="callteamsJS()"></body>
</html>
